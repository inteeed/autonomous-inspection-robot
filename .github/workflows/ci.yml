name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit tests (no ROS required)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: pip install pytest pyyaml

      - name: Run unit tests
        working-directory: ros2_ws/src/inspection_robot
        run: pytest test/ -v --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install flake8
        run: pip install flake8

      - name: Lint inspection_robot package
        working-directory: ros2_ws/src/inspection_robot
        run: |
          flake8 inspection_robot/ \
            --max-line-length=100 \
            --extend-ignore=E501,W503
